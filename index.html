<!DOCTYPE html>
<html>

<head>
    <title>My Second English Learning App</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 30px;
            padding: 24px;
            margin: 10px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "break through" mean?</p>

    <button onclick="checkAnswer('participate')">
        Participate in
    </button>

    <button onclick="checkAnswer('succeed')">
        Succeed
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "succeed") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!잘했어";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is succeed.틀렸";
            }

        }

    </script>

</body>
</html>
